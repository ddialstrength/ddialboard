<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="D’Dial Fitness Club strength leaderboard design preview with demo data.">
  <title>D’Dial Fitness Club — Leaderboard Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=gold-board-1">
</head>
<body>
  <video id="arenaVideo" class="arena-video" autoplay muted loop playsinline preload="metadata" poster="assets/ddial-arena-poster.jpg" aria-hidden="true" tabindex="-1">
    <source src="assets/ddial-arena-background-720p.webm" type="video/webm">
    <source src="assets/ddial-arena-background-720p.mp4" type="video/mp4">
  </video>
  <video id="sparksVideo" class="sparks-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1">
    <source src="assets/arena-sparks-720p.mp4" type="video/mp4">
  </video>
  <header class="topbar">
    <div class="metal-logo" role="img" aria-label="D’Dial Fitness Club logo"></div>
    <h1 id="slideTitle">WOMEN · STRENGTH BOARD</h1>
    <time class="clock" id="clock">--:--</time>
  </header>
  <main class="board-shell"><div id="slideStage" class="slide-stage" aria-live="polite"></div></main>
  <footer class="footer-bar"><span id="slideLabel">DEMO DATA · 1 / 10</span><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div></footer>
  <div class="control-panel" id="controls" aria-label="Leaderboard controls">
    <button class="control-btn" id="prevBtn" title="Previous slide" aria-label="Previous slide">‹</button>
    <button class="control-btn" id="pauseBtn" title="Pause playback" aria-label="Pause playback">Ⅱ</button>
    <button class="control-btn" id="nextBtn" title="Next slide" aria-label="Next slide">›</button>
    <button class="control-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">⛶</button>
  </div>
  <script src="assets/records.js?v=b493afd3"></script>
  <script src="app.js?v=gold-board-1"></script>
</body>
</html>
