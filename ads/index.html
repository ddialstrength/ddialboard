<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="D’Dial Fitness Club gift vouchers and Trinidad Carnival fitness countdown.">
  <title>D’Dial Fitness Club · Advertisements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Bodoni+Moda:wght@400;500;600&family=Great+Vibes&family=Inter:wght@500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=8730fb3">
</head>
<body>
  <main class="stage" aria-label="D’Dial advertisements">
    <section class="slide carnival-slide active" aria-label="Carnival fitness countdown" aria-hidden="false">
      <div class="carnival-photo" aria-hidden="true"></div>
      <div class="carnival-shade" aria-hidden="true"></div>
      <div class="carnival-inner">
        <img class="logo" src="assets/ddial-official-logo.webp" alt="D’Dial Fitness Club">
        <div class="carnival-copy">
          <div class="carnival-hero">
            <div class="countdown" aria-label="Days until Trinidad Carnival Monday, February 8, 2027">
              <b id="days">--</b><span>DAYS TO CARNIVAL</span>
            </div>
            <h1>GET FIT<br><span>FOR THE</span><br><strong>ROAD.</strong></h1>
          </div>
          <div class="carnival-details">
            <p class="date-line">CARNIVAL MONDAY <i>·</i> 8 FEBRUARY 2027</p>
            <p class="cta">YOUR CARNIVAL PREP STARTS AT D’DIAL.</p>
          </div>
        </div>
      </div>
    </section>
    <section class="slide gift-slide" aria-label="Christmas gift voucher" aria-hidden="true">
      <img class="gift-image" src="assets/ddial-christmas-gift-voucher.png" alt="D’Dial Fitness Club Christmas gift voucher advertisement">
    </section>
  </main>
  <div class="controls" aria-label="Advertisement controls">
    <button id="prev" aria-label="Previous advertisement" title="Previous advertisement">‹</button>
    <button id="pause" aria-label="Pause rotation" title="Pause rotation">Ⅱ</button>
    <span id="position" aria-live="polite">1 / 2</span>
    <button id="next" aria-label="Next advertisement" title="Next advertisement">›</button>
    <button id="fullscreen" aria-label="Fullscreen" title="Fullscreen">⛶</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
