<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="description" content="D’Dial Fitness Club strength competition starts November 1st. Bench press, squat and chest-supported row. For bragging rights.">
  <title>D’Dial Fitness Club — Strength Competition</title>
  <link rel="preload" as="image" href="assets/strength-competition-background.webp">
  <link rel="preload" as="image" href="assets/ddial-official-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="teaser.css?v=6">
</head>
<body>
  <main class="screen">
    <article class="poster is-playing" id="poster" aria-label="D’Dial strength competition teaser">
      <img class="poster-background" src="assets/strength-competition-background.webp" alt="" draggable="false">
      <header class="poster-header">
        <img class="brand-logo" src="assets/ddial-official-logo.webp" alt="D’Dial Fitness Club" draggable="false">
        <time class="clock" id="clock" aria-label="Current time">--:--</time>
      </header>
      <section class="hero-copy" aria-label="Strength competition">
        <h1 class="hero-title"><span class="strength">STRENGTH</span><span class="competition">COMPETITION</span></h1>
        <p class="question">WHO HAS THE BEST?</p>
        <div class="lifts" aria-label="Competition lifts"><span>BENCH PRESS</span><b aria-hidden="true">/</b><span>SQUAT</span><b aria-hidden="true">/</b><span>CHEST-SUPPORTED ROW</span></div>
      </section>
      <section class="poster-footer" aria-label="Competition details">
        <p class="date">STARTS NOVEMBER 1ST</p>
        <p class="instructions">TRAIN. CHALLENGE A RECORD. ASK A TRAINER FOR AN OFFICIAL ATTEMPT.</p>
        <p class="badge">FOR BRAGGING RIGHTS</p>
      </section>
    </article>
    <div class="controls" aria-label="Teaser controls">
      <button class="control" id="replay" type="button" aria-label="Replay animation and restart the five-minute timer" title="Replay animation and restart the five-minute timer"><span aria-hidden="true">↻</span> REPLAY <span id="remaining" class="remaining">05:00</span></button>
      <button class="control fullscreen" id="fullscreen" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">⛶</button>
    </div>
  </main>
  <script src="teaser.js?v=3"></script>
</body>
</html>
